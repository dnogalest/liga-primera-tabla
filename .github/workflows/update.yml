name: Actualizar tabla Liga de Primera

on:
  schedule:
    # Cada 20 minutos, todo el día. Ajustable: en GitHub esto corre en UTC.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}   # permite correrlo manualmente desde la pestaña Actions, para probar

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper
        run: python scrape.py

      - name: Commitear cambios si hay datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Actualizar tabla de posiciones $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
